<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<title>Index</title>

<style>
html, body {
  margin: 0;
  padding: 0;
  height: 100%;
  overflow: hidden;
  background: #454752;
  color: #eee;
  font-family: Arial, "Microsoft JhengHei", sans-serif;
}

.container {
  display: flex;
  height: 100%;
}

.sidebar {
  width: 240px;
  background: #1e1e1e;
  border-right: 1px solid #555;
}

.content {
  flex: 1;
  background: #454752;
}

iframe {
  width: 100%;
  height: 100%;
  border: none;
  background: transparent;
}
</style>

</head>
<body>

<div class="container">
  <div class="sidebar">
    <iframe src="layout.html" name="menu"></iframe>
  </div>

  <div class="content">
    <iframe src="home.html" name="content"></iframe>
  </div>
</div>

</body>
</html>
